<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Map — Georgia State Roleplay</title>
  <meta name="description" content="Live ERLC server map and player list for Georgia State Roleplay." />
  <meta name="theme-color" content="#4f6fff" />
  <link rel="icon" href="https://cdn.discordapp.com/icons/1530375780012658918/a1de3f778cee54317a36cbe02e0169de.webp?size=128" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/home.css" />
  <style>
    /* ── Page fade-in ── */
    body { animation: fadeIn 0.4s ease both; }

    /* ── Map page layout ── */
    .map-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 90px;
      position: relative;
      z-index: 1;
    }

    /* ── Stats bar ── */
    .map-stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }
    .map-stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 99px;
      background: rgba(79,111,255,0.08);
      border: 1px solid rgba(79,111,255,0.2);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      transition: box-shadow 0.3s;
    }
    .map-stat-pill:hover { box-shadow: 0 0 14px rgba(79,111,255,0.25); }
    .map-stat-pill svg { color: var(--blue); flex-shrink: 0; }
    .map-stat-pill .pill-label { color: var(--text-muted); font-weight: 500; }
    .map-stat-pill .pill-val   { color: var(--text); font-weight: 700; }

    .map-online-badge {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .map-online-badge.online  { background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.28); color: #22c55e; }
    .map-online-badge.offline { background: rgba(239,68,68,0.10);  border: 1px solid rgba(239,68,68,0.28);  color: #ef4444; }
    .map-online-badge .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulseDot 2s infinite; }

    /* ── Main content row ── */
    .map-body {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Player panel ── */
    .player-panel {
      background: rgba(0,0,0,0.5);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 90px - 54px);
      position: sticky;
      top: calc(90px + 54px);
      overflow: hidden;
    }
    .player-panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .player-panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-panel-title svg { color: var(--blue); }

    /* Search */
    .player-search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .player-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .player-search {
      width: 100%;
      padding: 8px 12px 8px 34px;
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .player-search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,111,255,0.15);
    }
    .player-search::placeholder { color: var(--text-muted); }

    /* Filter buttons */
    .filter-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--border-md); }
    .filter-btn.active-filter {
      background: rgba(79,111,255,0.15);
      border-color: rgba(79,111,255,0.4);
      color: var(--blue);
    }
    .filter-btn.leo-filter.active-filter    { background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.4); color: #60a5fa; }
    .filter-btn.fire-filter.active-filter   { background: rgba(239,68,68,0.10);  border-color: rgba(239,68,68,0.35);  color: #f87171; }
    .filter-btn.ems-filter.active-filter    { background: rgba(34,197,94,0.10);  border-color: rgba(34,197,94,0.35);  color: #4ade80; }
    .filter-btn.civ-filter.active-filter    { background: rgba(148,163,184,0.10);border-color: rgba(148,163,184,0.3); color: #94a3b8; }

    /* Player list */
    .player-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .player-list::-webkit-scrollbar { width: 3px; }
    .player-list::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 99px; }

    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: var(--r-sm);
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .player-item:hover { background: rgba(255,255,255,0.04); }

    .player-team-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .player-team-dot.leo  { background: #60a5fa; box-shadow: 0 0 6px rgba(96,165,250,0.6); }
    .player-team-dot.fire { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }
    .player-team-dot.ems  { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.6); }
    .player-team-dot.civ  { background: #94a3b8; }

    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-meta {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-callsign {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .player-callsign.leo  { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .player-callsign.fire { background: rgba(239,68,68,0.10);  color: #f87171; }
    .player-callsign.ems  { background: rgba(34,197,94,0.10);  color: #4ade80; }
    .player-callsign.civ  { background: rgba(148,163,184,0.08); color: #94a3b8; }

    .player-list-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .player-list-empty svg { margin: 0 auto 12px; opacity: 0.4; }

    /* ── Map area ── */
    .map-area {
      position: relative;
      background: #050810;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 600px;
    }

    /* Grid lines */
    .map-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,111,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,111,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Corner decoration */
    .map-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(79,111,255,0.3);
      border-style: solid;
    }
    .map-corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    .map-corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
    .map-corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    .map-corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    .map-coming-soon {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .map-coming-soon-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: rgba(79,111,255,0.08);
      border: 1px solid rgba(79,111,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(79,111,255,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: float 4s ease-in-out infinite;
    }
    .map-coming-soon-icon svg { color: var(--blue); }
    .map-coming-soon h2 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .map-coming-soon p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.7;
    }
    .map-glow-ring {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(79,111,255,0.12);
      box-shadow: 0 0 80px rgba(79,111,255,0.08);
      animation: glowPulse 5s ease-in-out infinite;
      pointer-events: none;
    }

    /* Refresh indicator */
    .map-refresh-row {
      position: absolute;
      bottom: 14px;
      right: 18px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .map-refresh-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulseDot 2s infinite;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .map-body { grid-template-columns: 1fr; }
      .player-panel {
        height: auto;
        max-height: 360px;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
    @media (max-width: 600px) {
      .map-stats-bar { gap: 8px; padding: 10px 16px; }
      .map-stat-pill { font-size: 11px; padding: 6px 12px; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ══ MAP PAGE ═══════════════════════════════════════════════════════════ -->
<div class="map-page">

  <!-- Stats bar -->
  <div class="map-stats-bar" id="statsBar">
    <div class="map-stat-pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>

      </svg>

    </div>
    <div class="map-stat-pill">
      <!-- Badge / LEO icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>

      <span class="pill-val" id="statLeo">—</span>

    <div class="map-stat-pill">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="pill-label">Civilian</span>
      <span class="pill-val" id="statCiv">—</span>
    </div>
    <div class="map-stat-pill">
      <!-- Queue icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>

  <!-- Body: player list + map -->
  <div class="map-body">

    <!-- Player list panel -->
    <aside class="player-panel">
      <div class="player-panel-header">
        <div class="player-panel-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>

<script>
/* ── Particles ── */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize, { passive: true });
  function rand(a, b) { return Math.random() * (b - a) + a; }
  class Particle {
    constructor() { this.reset(); }
    reset() { this.x=rand(0,W); this.y=rand(0,H); this.r=rand(0.5,1.8); this.vx=rand(-0.1,0.1); this.vy=rand(-0.2,-0.04); this.a=rand(0.05,0.3); this.da=rand(-0.001,0.001); }
    update() { this.x+=this.vx; this.y+=this.vy; this.a+=this.da; if(this.a<=0.03||this.a>=0.35) this.da*=-1; if(this.y<-10||this.x<-10||this.x>W+10) this.reset(); }
    draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle=`rgba(79,111,255,${this.a})`; ctx.fill(); }
  }
  for (let i=0; i<60; i++) particles.push(new Particle());
  (function loop() { ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();
})();

/* ── Navbar ── */
const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.style.background = window.scrollY > 40 ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.04)';
  navbar.style.backdropFilter = window.scrollY > 40 ? 'blur(36px) saturate(200%)' : 'blur(28px) saturate(180%)';
}, { passive: true });
const toggle = document.getElementById('navToggle');
const links  = document.getElementById('navLinks');
toggle.addEventListener('click', () => {
  const open = links.classList.toggle('open');
  toggle.setAttribute('aria-expanded', open);
  const [s0,s1,s2] = toggle.querySelectorAll('span');
  if (open) { s0.style.transform='translateY(7px) rotate(45deg)'; s1.style.opacity='0'; s2.style.transform='translateY(-7px) rotate(-45deg)'; }
  else { s0.style.transform=s1.style.opacity=s2.style.transform=''; }
});

/* ── Player data ── */
let allPlayers = [];
let activeFilter = 'all';

function getTeamClass(team) {
  if (!team) return 'civ';
  if (/police|state|sheriff/i.test(team)) return 'leo';
  if (/fire/i.test(team)) return 'fire';
  if (/ems|medic|paramedic/i.test(team)) return 'ems';
  return 'civ';
}

function renderPlayers() {
  const search  = document.getElementById('playerSearch').value.trim().toLowerCase();
  const list    = document.getElementById('playerList');
  const visible = allPlayers.filter(p => {
    const tc = getTeamClass(p.Team);
    const matchFilter = activeFilter === 'all' || tc === activeFilter;
    const matchSearch = !search || (p.Player||'').toLowerCase().includes(search) || (p.Team||'').toLowerCase().includes(search) || (p.Callsign||'').toLowerCase().includes(search);
    return matchFilter && matchSearch;
  });

  if (visible.length === 0) {
    list.innerHTML = `<div class="player-list-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      ${allPlayers.length === 0 ? 'No players online.' : 'No players match your filter.'}
    </div>`;
    return;
  }

  list.innerHTML = visible.map(p => {
    const tc = getTeamClass(p.Team);
    const cs = p.Callsign || '—';
    const team = p.Team || 'Civilian';
    return `<div class="player-item">
      <div class="player-team-dot ${tc}"></div>
      <div class="player-info">
        <div class="player-name">${escHtml(p.Player || 'Unknown')}</div>
        <div class="player-meta">${escHtml(team)}</div>
      </div>
      <span class="player-callsign ${tc}">${escHtml(cs)}</span>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
    btn.classList.add('active-filter');
    activeFilter = btn.dataset.filter;
    renderPlayers();
  });
});
document.getElementById('playerSearch').addEventListener('input', renderPlayers);

/* ── API fetch ── */
async function fetchMapData() {
  try {
    const res = await fetch('/api/erlc/server?Players=true', { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error();
    const d = await res.json();

    allPlayers = Array.isArray(d.Players) ? d.Players : [];
    const total = allPlayers.length;
    const leoCount = allPlayers.filter(p => getTeamClass(p.Team) === 'leo').length;
    const fireCount = allPlayers.filter(p => getTeamClass(p.Team) === 'fire').length;
    const emsCount = allPlayers.filter(p => getTeamClass(p.Team) === 'ems').length;
    const civCount = total - leoCount - fireCount - emsCount;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statLeo').textContent   = leoCount;
    document.getElementById('statCiv').textContent   = civCount;
    document.getElementById('statQueue').textContent = d.Queue ?? '0';
    document.getElementById('mapOnlineBadge').className = 'map-online-badge online';
    document.getElementById('mapStatusText').textContent = 'Online';
    document.getElementById('mapLastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();

    renderPlayers();
  } catch {
    document.getElementById('mapOnlineBadge').className = 'map-online-badge offline';
    document.getElementById('mapStatusText').textContent = 'Offline';
    document.getElementById('mapLastUpdated').textContent = 'Connection failed';
    allPlayers = [];
    renderPlayers();
  }
}

fetchMapData();
setInterval(fetchMapData, 15_000);
</script>
