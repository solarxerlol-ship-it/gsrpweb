<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics — Georgia State Roleplay Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Statistics</span>
    </header>
    <div class="content">

      <!-- Summary stats -->
      <div class="stats-grid mb-16" id="stats-grid"></div>

      <div class="two-col mb-16">
        <!-- Top hours -->
        <div class="card">
          <div class="card-header"><span class="card-title">Top Hours (7 Days)</span></div>
          <div id="top-hours"><div class="empty-state">Loading...</div></div>
        </div>
        <!-- Infraction breakdown -->
        <div class="card">
          <div class="card-header"><span class="card-title">Infractions (All Time)</span></div>
          <div id="infraction-stats"><div class="empty-state">Loading...</div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  async function init() {
    await renderSidebar();
    loadStats();
    loadTopHours();
    loadInfractionStats();
  }

  async function loadStats() {
    try {
      const [roster, loas, infractions] = await Promise.all([
        api("GET", "/api/staff/roster"),
        api("GET", "/api/staff/loa/all"),
        api("GET", "/api/infractions?limit=1&page=1"),
      ]);
      const onLoa = loas.filter(l => l.status === "approved").length;
      document.getElementById("stats-grid").innerHTML = `
        <div class="stat-card">
          <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div><div class="stat-value">${roster.length}</div><div class="stat-label">Total Staff</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <div><div class="stat-value">${onLoa}</div><div class="stat-label">On LOA</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <div><div class="stat-value">${infractions.total || 0}</div><div class="stat-label">Total Infractions</div></div>
        </div>
      `;
    } catch {}
  }

  async function loadTopHours() {
    try {
      const top = await api("GET", "/api/staff/shifts/top");
      const el  = document.getElementById("top-hours");
      if (!top.length) { el.innerHTML = '<div class="empty-state">No shift data this week.</div>'; return; }
      const max = top[0]?.total || 1;
      el.innerHTML = top.map((u, i) => `
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
            <span style="display:flex;align-items:center;gap:6px;">
              <span style="color:var(--text-muted);min-width:18px;">#${i+1}</span>
              <span>${u.username || u.discordId}</span>
            </span>
            <span style="color:var(--text-muted);">${formatDuration(u.total)}</span>
          </div>
          <div style="height:4px;background:var(--bg-surface);border-radius:2px;">
            <div style="height:4px;background:var(--accent);border-radius:2px;width:${Math.round((u.total/max)*100)}%;"></div>
          </div>
        </div>
      `).join("");
    } catch {}
  }

  async function loadInfractionStats() {
    try {
      const data = await api("GET", "/api/infractions?limit=1000&page=1");
      const el   = document.getElementById("infraction-stats");
      const records = data.records || [];
      const counts  = {};
      records.forEach(r => { counts[r.type] = (counts[r.type] || 0) + 1; });
      const total = records.length;
      if (!total) { el.innerHTML = '<div class="empty-state">No infractions.</div>'; return; }
      const COLOR = { verbal:"gray", warn:"yellow", strike:"yellow", mute:"blue", kick:"purple", ban:"red" };
      el.innerHTML = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([type, count]) => `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="badge badge-${COLOR[type]||'gray'}">${type}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;min-width:120px;">
            <div style="flex:1;height:4px;background:var(--bg-surface);border-radius:2px;">
              <div style="height:4px;background:var(--accent);border-radius:2px;width:${Math.round((count/total)*100)}%;"></div>
            </div>
            <span style="font-size:12px;color:var(--text-muted);min-width:24px;text-align:right;">${count}</span>
          </div>
        </div>
      `).join("");
    } catch {}
  }

  init();
</script>
</body>
</html>
