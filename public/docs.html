<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs — Georgia State Roleplay Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Two-pane layout ── */
    .docs-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    /* ── Left sidebar: doc list ── */
    .docs-sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-surface);
    }
    .docs-sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .docs-search {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-md);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .docs-search:focus { border-color: var(--accent); }
    .docs-search::placeholder { color: var(--text-muted); }

    .docs-cat-filters {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .docs-cat-btn {
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .docs-cat-btn:hover { border-color: var(--border-md); color: var(--text-primary); }
    .docs-cat-btn.active-cat {
      background: var(--accent-soft);
      border-color: rgba(79,111,255,0.4);
      color: var(--accent);
    }

    .docs-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .docs-list::-webkit-scrollbar { width: 3px; }
    .docs-list::-webkit-scrollbar-thumb { background: rgba(79,111,255,0.2); border-radius: 99px; }

    .doc-list-item {
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .doc-list-item:hover { background: var(--bg-hover); }
    .doc-list-item.active {
      background: var(--accent-soft);
      border-color: rgba(79,111,255,0.2);
    }
    .doc-list-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .doc-list-item.active .doc-list-title { color: var(--accent); }
    .doc-list-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .doc-list-cat {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 6px;
      border-radius: 99px;
    }
    .doc-list-date { font-size: 10px; color: var(--text-muted); }

    .docs-list-empty {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ── Right pane: doc viewer ── */
    .docs-viewer {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .docs-viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 48px;
    }
    .docs-viewer-body {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }
    .docs-viewer-body::-webkit-scrollbar { width: 3px; }
    .docs-viewer-body::-webkit-scrollbar-thumb { background: rgba(79,111,255,0.2); border-radius: 99px; }

    /* ── Doc content renderer ── */
    .doc-content {
      max-width: 780px;
      margin: 0 auto;
    }
    .doc-content h1 {
      font-size: 26px; font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .doc-content .doc-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .doc-content .doc-body {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.8;
    }
    /* Rich text styles inside doc body */
    .doc-body h1 { font-size: 22px; font-weight: 700; margin: 24px 0 10px; }
    .doc-body h2 { font-size: 18px; font-weight: 700; margin: 20px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .doc-body h3 { font-size: 15px; font-weight: 700; margin: 16px 0 6px; }
    .doc-body p  { margin-bottom: 12px; }
    .doc-body ul, .doc-body ol { margin: 10px 0 12px 20px; }
    .doc-body li { margin-bottom: 5px; }
    .doc-body strong { font-weight: 700; color: var(--text-primary); }
    .doc-body em { font-style: italic; color: var(--text-secondary); }
    .doc-body code {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: rgba(79,111,255,0.08);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent);
    }
    .doc-body pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .doc-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 12px 0;
      background: var(--accent-soft);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-secondary);
    }
    .doc-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }
    .doc-body a { color: var(--accent); text-decoration: underline; }
    .doc-body table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .doc-body th { background: rgba(79,111,255,0.08); padding: 8px 12px; text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border-md); }
    .doc-body td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }

    /* Empty / select state */
    .docs-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-muted);
    }
    .docs-empty-state svg { opacity: 0.25; }
    .docs-empty-state p { font-size: 13px; }

    /* ── Editor ── */
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      flex-shrink: 0;
    }
    .editor-toolbar-btn {
      width: 28px; height: 28px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 12px; font-weight: 700;
      transition: background 0.12s, color 0.12s;
    }
    .editor-toolbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .editor-toolbar-btn.active { background: var(--accent-soft); color: var(--accent); }
    .editor-toolbar-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }

    #doc-editor {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      outline: none;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-primary);
      min-height: 200px;
    }
    #doc-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }
    /* inherit doc body styles in editor */
    #doc-editor h1, #doc-editor h2, #doc-editor h3,
    #doc-editor p, #doc-editor ul, #doc-editor ol,
    #doc-editor li, #doc-editor blockquote, #doc-editor pre,
    #doc-editor code, #doc-editor strong, #doc-editor em {
      /* inherits from .doc-body rules above via same cascade */
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Docs</span>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="new-doc-btn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Doc
        </button>
      </div>
    </header>

    <div class="docs-layout">

      <!-- Left: doc list -->
      <div class="docs-sidebar">
        <div class="docs-sidebar-header">
          <input class="docs-search" id="docs-search" placeholder="Search docs..." autocomplete="off" />
        </div>
        <div class="docs-cat-filters" id="cat-filters">
          <button class="docs-cat-btn active-cat" data-cat="">All</button>
          <button class="docs-cat-btn" data-cat="policy">Policy</button>
          <button class="docs-cat-btn" data-cat="sop">SOP</button>
          <button class="docs-cat-btn" data-cat="training">Training</button>
          <button class="docs-cat-btn" data-cat="forms">Forms</button>
          <button class="docs-cat-btn" data-cat="other">Other</button>
        </div>
        <div class="docs-list" id="docs-list">
          <div class="docs-list-empty">Loading...</div>
        </div>
      </div>

      <!-- Right: viewer / editor -->
      <div class="docs-viewer" id="docs-viewer">
        <div class="docs-empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <p>Select a document to view</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const CAT_COLORS = {
    policy: "badge-red", sop: "badge-blue", training: "badge-green",
    forms: "badge-yellow", other: "badge-gray"
  };
  const CAT_TEXT_COLORS = {
    policy: "#ef4444", sop: "#4f6fff", training: "#22c55e",
    forms: "#f59e0b", other: "#6b7280"
  };

  let allDocs     = [];
  let currentCat  = "";
  let currentDoc  = null;
  let currentUser = null;
  let isEditing   = false;
  let isNew       = false;

  async function init() {
    await renderSidebar();
    currentUser = await getUser();
    if (currentUser && ['management','owner'].includes(currentUser.accessLevel)) {
      document.getElementById('new-doc-btn').style.display = '';
    }
    setupFilters();
    setupSearch();
    document.getElementById('new-doc-btn').addEventListener('click', startNew);
    await loadDocs();
  }

  /* ── Load & render list ──────────────────────────────────────────────────── */
  async function loadDocs() {
    try {
      allDocs = await api('GET', '/api/docs');
      renderList();
    } catch (err) {
      document.getElementById('docs-list').innerHTML =
        `<div class="docs-list-empty">${err.message}</div>`;
    }
  }

  function renderList() {
    const search   = document.getElementById('docs-search').value.trim().toLowerCase();
    const filtered = allDocs.filter(d => {
      const matchCat  = !currentCat || d.category === currentCat;
      const matchSrch = !search || d.title.toLowerCase().includes(search) || (d.description||'').toLowerCase().includes(search);
      return matchCat && matchSrch;
    });

    const el = document.getElementById('docs-list');
    if (!filtered.length) {
      el.innerHTML = '<div class="docs-list-empty">No documents found.</div>';
      return;
    }
    el.innerHTML = filtered.map(d => `
      <div class="doc-list-item ${currentDoc?._id === d._id ? 'active' : ''}" data-doc-open="${d._id}">
        <div class="doc-list-title">${escHtml(d.title)}</div>
        <div class="doc-list-meta">
          <span class="doc-list-cat badge ${CAT_COLORS[d.category]||'badge-gray'}">${d.category}</span>
          <span class="doc-list-date">${formatDate(d.createdAt)}</span>
        </div>
      </div>
    `).join('');
  }

  /* ── Category filters ────────────────────────────────────────────────────── */
  function setupFilters() {
    document.querySelectorAll('.docs-cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.docs-cat-btn').forEach(b => b.classList.remove('active-cat'));
        btn.classList.add('active-cat');
        currentCat = btn.dataset.cat;
        renderList();
      });
    });
  }

  function setupSearch() {
    document.getElementById('docs-search').addEventListener('input', renderList);
  }

  /* ── Open / view doc ─────────────────────────────────────────────────────── */
  function openDoc(id) {
    currentDoc = allDocs.find(d => d._id === id);
    if (!currentDoc) return;
    isEditing = false; isNew = false;
    renderList(); // re-render to show active
    renderViewer();
  }

  function renderViewer() {
    const viewer = document.getElementById('docs-viewer');
    const canEdit = currentUser && ['management','owner'].includes(currentUser.accessLevel);

    viewer.innerHTML = `
      <div class="docs-viewer-toolbar">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge ${CAT_COLORS[currentDoc.category]||'badge-gray'}">${currentDoc.category}</span>
          <span style="font-size:13px;font-weight:600;color:var(--text-primary);">${escHtml(currentDoc.title)}</span>
        </div>
        <div style="display:flex;gap:6px;">
          ${currentDoc.url ? `<a href="${currentDoc.url}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Open Link
          </a>` : ''}
          ${canEdit ? `
            <button class="btn btn-ghost btn-sm" data-doc-action="edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit
            </button>
            <button class="btn btn-danger btn-sm" data-doc-action="delete" data-id="${currentDoc._id}">Delete</button>
          ` : ''}
        </div>
      </div>
      <div class="docs-viewer-body">
        <div class="doc-content">
          <h1>${escHtml(currentDoc.title)}</h1>
          <div class="doc-meta-row">
            <span class="badge ${CAT_COLORS[currentDoc.category]||'badge-gray'}">${currentDoc.category}</span>
            <span style="font-size:12px;color:var(--text-muted);">By ${escHtml(currentDoc.authorName||'Unknown')}</span>
            <span style="font-size:12px;color:var(--text-muted);">${formatDate(currentDoc.createdAt)}</span>
            ${currentDoc.updatedAt > currentDoc.createdAt
              ? `<span style="font-size:12px;color:var(--text-muted);">Updated ${formatDate(currentDoc.updatedAt)}</span>` : ''}
          </div>
          <div class="doc-body">${currentDoc.content || '<p style="color:var(--text-muted);">No content yet.</p>'}</div>
        </div>
      </div>
    `;
  }

  /* ── Editor ──────────────────────────────────────────────────────────────── */
  function startNew() {
    currentDoc = { title: '', category: 'other', url: '', content: '', description: '' };
    isNew = true; isEditing = true;
    currentDoc._id = null;
    renderEditor();
  }

  function startEdit() {
    isEditing = true; isNew = false;
    renderEditor();
  }

  function renderEditor() {
    const viewer = document.getElementById('docs-viewer');
    viewer.innerHTML = `
      <!-- Editor meta bar -->
      <div class="docs-viewer-toolbar" style="flex-wrap:wrap;gap:8px;height:auto;padding:10px 16px;">
        <input id="edit-title" class="form-input" style="flex:1;min-width:180px;" placeholder="Document title" value="${escHtml(currentDoc.title||'')}">
        <select id="edit-category" class="form-select" style="width:120px;">
          <option value="policy" ${currentDoc.category==='policy'?'selected':''}>Policy</option>
          <option value="sop" ${currentDoc.category==='sop'?'selected':''}>SOP</option>
          <option value="training" ${currentDoc.category==='training'?'selected':''}>Training</option>
          <option value="forms" ${currentDoc.category==='forms'?'selected':''}>Forms</option>
          <option value="other" ${currentDoc.category==='other'?'selected':''}>Other</option>
        </select>
        <input id="edit-url" class="form-input" style="width:220px;" placeholder="Link (optional)" value="${escHtml(currentDoc.url||'')}">
        <div style="display:flex;gap:6px;margin-left:auto;">
          <button class="btn btn-ghost btn-sm" data-doc-action="cancel">Cancel</button>
          <button class="btn btn-primary btn-sm" data-doc-action="save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save
          </button>
        </div>
      </div>

      <!-- Rich text toolbar -->
      <div class="editor-toolbar">
        <button class="editor-toolbar-btn" data-fmt="bold" title="Bold"><b>B</b></button>
        <button class="editor-toolbar-btn" data-fmt="italic" title="Italic"><i>I</i></button>
        <button class="editor-toolbar-btn" data-fmt="underline" title="Underline"><u>U</u></button>
        <div class="editor-toolbar-sep"></div>
        <button class="editor-toolbar-btn" data-fmt-block="h1" title="Heading 1" style="font-size:11px;">H1</button>
        <button class="editor-toolbar-btn" data-fmt-block="h2" title="Heading 2" style="font-size:11px;">H2</button>
        <button class="editor-toolbar-btn" data-fmt-block="h3" title="Heading 3" style="font-size:11px;">H3</button>
        <button class="editor-toolbar-btn" data-fmt-block="p" title="Paragraph" style="font-size:11px;">¶</button>
        <div class="editor-toolbar-sep"></div>
        <button class="editor-toolbar-btn" data-fmt="insertUnorderedList" title="Bullet list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        </button>
        <button class="editor-toolbar-btn" data-fmt="insertOrderedList" title="Numbered list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
        </button>
        <div class="editor-toolbar-sep"></div>
        <button class="editor-toolbar-btn" data-doc-action="hr" title="Divider" style="font-size:11px;">—</button>
        <button class="editor-toolbar-btn" data-doc-action="link" title="Link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <button class="editor-toolbar-btn" data-doc-action="code" title="Code block" style="font-size:11px;font-family:monospace;">&lt;/&gt;</button>
        <div class="editor-toolbar-sep"></div>
        <button class="editor-toolbar-btn" data-fmt="justifyLeft" title="Left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button class="editor-toolbar-btn" data-fmt="justifyCenter" title="Center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
      </div>

      <!-- Editable content area -->
      <div id="doc-editor" class="doc-body" contenteditable="true"
        data-placeholder="Start writing your document here..."
        style="flex:1;overflow-y:auto;padding:24px 32px;outline:none;font-size:14px;line-height:1.8;color:var(--text-primary);min-height:200px;"
      >${currentDoc.content || ''}</div>
      <div id="save-alert" style="padding:0 16px 8px;"></div>
    `;
  }

  function fmt(cmd) {
    document.getElementById('doc-editor')?.focus();
    document.execCommand(cmd, false, null);
  }

  function fmtBlock(tag) {
    document.getElementById('doc-editor')?.focus();
    document.execCommand('formatBlock', false, tag);
  }

  function insertHr() {
    document.getElementById('doc-editor')?.focus();
    document.execCommand('insertHTML', false, '<hr>');
  }

  function insertLink() {
    const url = prompt('Enter URL:');
    if (url) {
      document.getElementById('doc-editor')?.focus();
      document.execCommand('createLink', false, url);
    }
  }

  function insertCode() {
    document.getElementById('doc-editor')?.focus();
    document.execCommand('insertHTML', false, '<pre><code>// code here</code></pre>');
  }

  function cancelEdit() {
    isEditing = false;
    if (isNew) {
      currentDoc = null;
      document.getElementById('docs-viewer').innerHTML = `
        <div class="docs-empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <p>Select a document to view</p>
        </div>`;
    } else {
      renderViewer();
    }
  }

  async function saveDoc() {
    const alertEl = document.getElementById('save-alert');
    const titleEl = document.getElementById('edit-title');
    const editorEl = document.getElementById('doc-editor');

    if (!titleEl || !editorEl) {
      showToast('Editor not ready.', 'error');
      return;
    }

    const title   = titleEl.value.trim();
    const content = editorEl.innerHTML;

    if (!title) {
      if (alertEl) alertEl.innerHTML = '<div class="alert alert-error show">Title is required.</div>';
      return;
    }

    const payload = {
      title,
      category:    document.getElementById('edit-category').value,
      url:         (document.getElementById('edit-url').value || '').trim(),
      content,
      description: content.replace(/<[^>]*>/g, '').slice(0, 160),
    };

    const wasNew = isNew;

    try {
      if (wasNew) {
        const doc = await api('POST', '/api/docs', payload);
        await loadDocs();
        currentDoc = allDocs.find(d => d._id === doc._id)
          || { ...payload, _id: doc._id, authorName: currentUser.displayName, createdAt: Date.now(), updatedAt: Date.now() };
      } else {
        await api('PATCH', `/api/docs/${currentDoc._id}`, payload);
        await loadDocs();
        currentDoc = allDocs.find(d => d._id === currentDoc._id);
      }
      isEditing = false;
      isNew     = false;
      renderList();
      renderViewer();
      showToast(wasNew ? 'Document created.' : 'Document saved.');
    } catch (err) {
      if (alertEl) alertEl.innerHTML = `<div class="alert alert-error show">${err.message}</div>`;
      else showToast(err.message, 'error');
    }
  }

  async function deleteDoc(id) {
    if (!confirm('Delete this document? This cannot be undone.')) return;
    try {
      await api('DELETE', `/api/docs/${id}`);
      currentDoc = null;
      document.getElementById('docs-viewer').innerHTML = `
        <div class="docs-empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <p>Document deleted.</p>
        </div>`;
      showToast('Document deleted.');
      await loadDocs();
      renderList();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Single delegated listener for ALL dynamic buttons ───────────────────
  document.getElementById('docs-viewer').addEventListener('click', e => {
    // Toolbar fmt buttons
    const fmtBtn = e.target.closest('[data-fmt]');
    if (fmtBtn) { e.preventDefault(); fmt(fmtBtn.dataset.fmt); return; }

    const fmtBlockBtn = e.target.closest('[data-fmt-block]');
    if (fmtBlockBtn) { e.preventDefault(); fmtBlock(fmtBlockBtn.dataset.fmtBlock); return; }

    const docAction = e.target.closest('[data-doc-action]');
    if (docAction) {
      e.preventDefault();
      const action = docAction.dataset.docAction;
      if (action === 'save')   saveDoc();
      if (action === 'cancel') cancelEdit();
      if (action === 'edit')   startEdit();
      if (action === 'delete') deleteDoc(docAction.dataset.id);
      if (action === 'hr')     insertHr();
      if (action === 'link')   insertLink();
      if (action === 'code')   insertCode();
      return;
    }
  });

  // Doc list item clicks
  document.getElementById('docs-list').addEventListener('click', e => {
    const item = e.target.closest('[data-doc-open]');
    if (item) openDoc(item.dataset.docOpen);
  });

  init();
</script>
</body>
</html>
