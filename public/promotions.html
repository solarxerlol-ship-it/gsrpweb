<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions — GSSRP Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Promotions & History</span>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="add-btn">+ Log Promotion</button>
      </div>
    </header>
    <div class="content">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Type</th>
                <th>From</th>
                <th>To</th>
                <th>Reason</th>
                <th>By</th>
                <th>Date</th>
                <th>Source</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add Promotion Modal -->
<div class="modal-overlay" id="modal-add">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Log Promotion / Demotion</span>
      <button class="modal-close" onclick="closeModal('modal-add')">&times;</button>
    </div>
    <div id="add-alert"></div>
    <form id="add-form">
      <div class="form-group">
        <label class="form-label">Discord User ID</label>
        <input class="form-input" id="p-userid" placeholder="123456789012345678" required>
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="p-type">
          <option value="promotion">Promotion</option>
          <option value="demotion">Demotion</option>
          <option value="transfer">Transfer</option>
          <option value="hire">Hire</option>
          <option value="termination">Termination</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">From Role</label>
          <input class="form-input" id="p-from" placeholder="Previous rank">
        </div>
        <div class="form-group">
          <label class="form-label">To Role</label>
          <input class="form-input" id="p-to" placeholder="New rank" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <input class="form-input" id="p-reason" placeholder="Reason">
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="p-notes" placeholder="Optional notes..."></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-add')">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const TYPE_COLOR = {
    promotion: "green", demotion: "red", transfer: "blue",
    hire: "green", termination: "red",
  };

  let currentPage = 1;

  async function init() {
    await renderSidebar();
    load(1);
  }

  async function load(page) {
    currentPage = page;
    try {
      const data = await api("GET", `/api/promotions?page=${page}&limit=25`);
      renderTable(data.records);
      renderPagination(data.page, data.pages);
    } catch (err) {
      document.getElementById("table-body").innerHTML =
        `<tr><td colspan="8" class="empty-state">${err.message}</td></tr>`;
    }
  }

  function renderTable(records) {
    const tbody = document.getElementById("table-body");
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No records found.</td></tr>';
      return;
    }
    tbody.innerHTML = records.map(r => `
      <tr>
        <td class="mono">${r.userId}</td>
        <td><span class="badge badge-${TYPE_COLOR[r.type] || 'gray'}">${r.type}</span></td>
        <td class="text-muted">${r.fromRole || "—"}</td>
        <td>${r.toRole || "—"}</td>
        <td class="truncate" style="max-width:180px;">${r.reason || "—"}</td>
        <td class="text-muted">${r.executor || "—"}</td>
        <td class="text-muted">${formatDate(r.timestamp)}</td>
        <td><span class="badge ${r.source === 'web' ? 'badge-blue' : 'badge-gray'}">${r.source || 'bot'}</span></td>
      </tr>
    `).join("");
  }

  function renderPagination(page, pages) {
    const el = document.getElementById("pagination");
    if (pages <= 1) { el.innerHTML = ""; return; }
    let html = "";
    for (let i = 1; i <= pages; i++) {
      html += `<button class="page-btn${i === page ? " active" : ""}" onclick="load(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }

  document.getElementById("add-btn").addEventListener("click", () => openModal("modal-add"));

  document.getElementById("add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById("add-alert");
    alertEl.innerHTML = "";
    try {
      await api("POST", "/api/promotions", {
        userId:   document.getElementById("p-userid").value.trim(),
        type:     document.getElementById("p-type").value,
        fromRole: document.getElementById("p-from").value.trim(),
        toRole:   document.getElementById("p-to").value.trim(),
        reason:   document.getElementById("p-reason").value.trim(),
        notes:    document.getElementById("p-notes").value.trim(),
      });
      closeModal("modal-add");
      e.target.reset();
      showToast("Promotion logged.");
      load(currentPage);
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error show">${err.message}</div>`;
    }
  });

  init();
</script>
</body>
</html>
