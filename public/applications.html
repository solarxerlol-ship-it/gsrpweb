<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications — Georgia State Roleplay Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Applications</span>
      <div class="topbar-right">
        <span class="badge badge-blue" id="pending-count">Loading...</span>
        <button class="btn btn-ghost btn-sm" id="refresh-btn">↻ Refresh</button>
      </div>
    </header>
    <div class="content">

      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:18px;">
        <div class="tab active" data-tab="pending">Pending</div>
        <div class="tab" data-tab="accepted">Accepted</div>
        <div class="tab" data-tab="denied">Denied</div>
      </div>

      <!-- Pending -->
      <div id="panel-pending">
        <div id="list-pending"><div class="empty-state">Loading applications...</div></div>
      </div>

      <!-- Accepted -->
      <div id="panel-accepted" style="display:none;">
        <div id="list-accepted"><div class="empty-state">No accepted applications yet.</div></div>
      </div>

      <!-- Denied -->
      <div id="panel-denied" style="display:none;">
        <div id="list-denied"><div class="empty-state">No denied applications yet.</div></div>
      </div>

    </div>
  </div>
</div>

<!-- Review modal -->
<div class="modal-overlay" id="modal-review">
  <div class="modal modal-lg" style="max-height:90vh;display:flex;flex-direction:column;width:100%;max-width:760px;">
    <div class="modal-header" style="flex-shrink:0;">
      <span class="modal-title" id="modal-title">Application Review</span>
      <button class="modal-close" data-close-modal="modal-review">&times;</button>
    </div>
    <!-- Scrollable body -->
    <div id="modal-body" style="overflow-y:auto;flex:1;padding-right:4px;margin-bottom:14px;"></div>
    <div id="modal-alert"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;border-top:1px solid var(--border);padding-top:14px;" id="modal-actions"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let apps = { pending: [], accepted: [], denied: [] };
  let activeTab = 'pending';
  let currentApp = null;

  async function init() {
    await getUser();
    renderSidebar();
    setupTabs();
    loadApplications();
  }

  function setupTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        ['pending','accepted','denied'].forEach(p => document.getElementById(`panel-${p}`).style.display = 'none');
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        document.getElementById(`panel-${activeTab}`).style.display = '';
      });
    });
  }

  async function loadApplications() {
    try {
      const all = await api('GET', '/api/applications');
      apps.pending  = all.filter(a => a.status === 'pending');
      apps.accepted = all.filter(a => a.status === 'accepted');
      apps.denied   = all.filter(a => a.status === 'denied');

      const pc = document.getElementById('pending-count');
      pc.textContent = `${apps.pending.length} Pending`;
      pc.className = apps.pending.length > 0 ? 'badge badge-yellow' : 'badge badge-gray';

      renderList('pending');
      renderList('accepted');
      renderList('denied');
    } catch (err) {
      document.getElementById('list-pending').innerHTML = `<div class="empty-state">${err.message}</div>`;
    }
  }

  function renderList(tab) {
    const el = document.getElementById(`list-${tab}`);
    const list = apps[tab];
    if (!list.length) {
      const msgs = { pending: 'No pending applications.', accepted: 'No accepted applications.', denied: 'No denied applications.' };
      el.innerHTML = `<div class="empty-state">${msgs[tab]}</div>`;
      return;
    }

  el.innerHTML = list.map(a => `
      <div class="card" style="padding:18px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;cursor:pointer;" data-app-id="${a._id}">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
            <span style="font-weight:700;font-size:14px;">${escHtml(a.robloxUsername)}</span>
            <span class="badge badge-blue" style="font-size:10px;">${escHtml(a.department)}</span>
            ${statusBadge(a.status)}
            ${a.mcAnswers?.allCorrect === false ? '<span class="badge badge-red" style="font-size:10px;">MC Errors</span>' : ''}
            ${a.mcAnswers?.allCorrect === true  ? '<span class="badge badge-green" style="font-size:10px;">MC Passed</span>' : ''}
          </div>
          <div style="font-size:12px;color:var(--text-secondary);">
            Discord: ${escHtml(a.discordUsername)} &nbsp;·&nbsp; Age: ${escHtml(a.age)} &nbsp;·&nbsp; ${formatDate(a.createdAt)}
          </div>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:var(--text-muted);flex-shrink:0;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    `).join('');
  }

  function statusBadge(s) {
    const map = { pending: 'badge-yellow', accepted: 'badge-green', denied: 'badge-red' };
    return `<span class="badge ${map[s] || 'badge-gray'}">${capitalize(s)}</span>`;
  }

  function openApp(id) {
    const a = [...apps.pending, ...apps.accepted, ...apps.denied].find(x => x._id === id);
    if (!a) return;
    currentApp = a;

    document.getElementById('modal-title').textContent = `${a.robloxUsername} — ${a.department}`;
    document.getElementById('modal-alert').innerHTML = '';

    const MC_LABELS = {
      rdm:      'What does RDM stand for and what is it?',
      vdm:      'What does VDM stand for and what is it?',
      failrp:   'Which of these is an example of FailRP?',
      safezone: 'Can you engage someone inside a safe zone?',
      meta:     'What is metagaming?',
      pursuit:  'Pursuit into a spawn area — what do you do?',
      nlr:      'What does NLR (New Life Rule) mean?',
    };
    const MC_OPTIONS = {
      rdm:      { a:'Random Deathmatch — killing/shooting with zero RP reason', b:'Rapid Deployment Mode — staff respond to situation', c:'Rule Defined Moderation — issuing punishments', d:'Shooting back at someone who shot first' },
      vdm:      { a:'Vehicle Damage Mode — enabling PvP in vehicles', b:'Vehicle Deathmatch — using your car to kill/injure', c:'Accidentally bumping someone during a chase', d:'Speeding through a red light on duty' },
      failrp:   { a:'Suspect runs from police on foot after refusing to comply', b:'Player jumps off roof, lands fine, keeps running like nothing happened', c:'Officer initiates traffic stop for broken tail light', d:'Civilian calls 911 to report a robbery' },
      safezone: { a:'Yes, if they committed a crime beforehand', b:'No — safe zones are off-limits for any hostile action', c:'Only with admin approval', d:'Yes, but only with a weapon out' },
      meta:     { a:'Using info your character wouldn\'t know to gain RP advantage', b:'Playing on multiple accounts at once', c:'Exploiting a bug to duplicate vehicles', d:'Talking in Discord while in-game' },
      pursuit:  { a:'Continue pursuit into spawn area and arrest them', b:'Stop at edge, hold perimeter, wait for them to leave', c:'Ram their car before they fully enter', d:'Call it off since spawn areas protect everyone' },
      nlr:      { a:'You can return to the same situation immediately after respawning', b:'After dying, character forgets — can\'t return to same RP situation', c:'A rule that lets new players skip requirements', d:'Must wait 5 minutes before rejoining a server' },
    };
    const MC_CORRECT = { rdm:'a', vdm:'b', failrp:'b', safezone:'b', meta:'a', pursuit:'b', nlr:'b' };
    const mc = a.mcAnswers || {};

    function section(title) {
      return `<div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);">${title}</div>`;
    }

    function infoGrid(pairs) {
      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${pairs.map(([k,v]) => `
          <div style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;padding:10px 12px;">
            <div style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;">${k}</div>
            <div style="font-size:13px;font-weight:600;color:var(--text-primary);">${escHtml(String(v || '—'))}</div>
          </div>`).join('')}
      </div>`;
    }

    function mcRow(q) {
      const chosen  = mc[q];
      const correct = MC_CORRECT[q];
      const isRight = chosen === correct;
      const opts    = MC_OPTIONS[q] || {};
      return `<div style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:7px;padding:12px 14px;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">${MC_LABELS[q]}</div>
        ${Object.entries(opts).map(([letter, text]) => {
          const isChosen  = letter === chosen;
          const isCorrect = letter === correct;
          let bg = 'transparent', border = 'var(--border)', color = 'var(--text-muted)';
          if (isCorrect) { bg = 'rgba(34,197,94,0.08)'; border = 'rgba(34,197,94,0.35)'; color = 'var(--success)'; }
          if (isChosen && !isCorrect) { bg = 'rgba(239,68,68,0.08)'; border = 'rgba(239,68,68,0.35)'; color = 'var(--danger)'; }
          const icon = isCorrect ? '✓' : (isChosen && !isCorrect ? '✗' : '');
          const weight = (isChosen || isCorrect) ? '700' : '500';
          return `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:5px;background:${bg};border:1px solid ${border};margin-bottom:4px;">
            <span style="font-size:11px;font-weight:700;color:${color};min-width:14px;">${icon || letter.toUpperCase()}</span>
            <span style="font-size:12px;color:${color};font-weight:${weight};line-height:1.5;">${escHtml(text)}</span>
          </div>`;
        }).join('')}
      </div>`;
    }

    function longAnswer(label, val) {
      const text = (val || '').trim();
      return `<div style="margin-bottom:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">${label}</div>
        <div style="font-size:13px;color:${text ? 'var(--text-primary)' : 'var(--text-muted)'};line-height:1.75;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:7px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;">${text ? escHtml(text) : '<em>No answer provided.</em>'}</div>
      </div>`;
    }

    // MC score
    const mcKeys = Object.keys(MC_CORRECT);
    const answered = mcKeys.filter(q => mc[q]);
    const correct  = mcKeys.filter(q => mc[q] === MC_CORRECT[q]);
    const scoreColor = correct.length >= 6 ? 'var(--success)' : correct.length >= 4 ? 'var(--warning)' : 'var(--danger)';

    document.getElementById('modal-body').innerHTML = `
      ${section('Basic Info')}
      ${infoGrid([
        ['Roblox Username', a.robloxUsername],
        ['Discord Username', a.discordUsername],
        ['Discord ID',       a.discordId],
        ['Age Range',        a.age],
        ['Timezone',         a.timezone || '—'],
        ['Department',       a.department],
        ['ERLC Experience',  a.experience],
        ['Submitted',        formatDate(a.createdAt)],
        ['Status',           capitalize(a.status)],
        ['Reviewed By',      a.reviewedBy || '—'],
      ])}

      ${section(`ERLC Knowledge — Score: ${correct.length}/${mcKeys.length}`)}
      <div style="margin-bottom:4px;font-size:12px;color:${scoreColor};font-weight:700;">${correct.length}/${mcKeys.length} correct &nbsp;${correct.length === mcKeys.length ? '🎉 Perfect score' : correct.length >= 5 ? '👍 Solid' : '⚠️ Needs review'}</div>
      ${mcKeys.map(q => mcRow(q)).join('')}

      ${section('Staff Scenarios')}
      ${longAnswer('Scenario 1 — Player reports repeated RDM', a.scenario1)}
      ${longAnswer('Scenario 2 — Witnessed VDM, one prior verbal warning', a.scenario2)}
      ${longAnswer('Scenario 3 — Rule-breaker keeps logging off', a.scenario3)}
      ${longAnswer('Scenario 4 — Staff member letting friends break rules', a.scenario4)}
      ${longAnswer('Scenario 5 — Two players arguing about RDM simultaneously', a.scenario5)}

      ${section('About You')}
      ${longAnswer('Why GSRP staff specifically?', a.whyJoin)}
      ${longAnswer('Biggest strength', a.strength)}
      ${longAnswer('Areas to improve / weakness', a.weakness)}
      ${longAnswer('Weekly availability / hours', a.availability)}
      ${longAnswer('Previous staff experience', a.prevStaff)}
      ${longAnswer('Prior bans or warnings', a.bans)}
      ${longAnswer('Anything else', a.extra)}
    `;

    // Action buttons
    const actionsEl = document.getElementById('modal-actions');
    if (a.status === 'pending') {
      actionsEl.innerHTML = `
        <button class="btn btn-ghost" data-close-modal="modal-review">Close</button>
        <button class="btn btn-danger" data-action="deny">✗ Deny</button>
        <button class="btn btn-success" data-action="accept">✓ Accept</button>
      `;
    } else {
      actionsEl.innerHTML = `<button class="btn btn-ghost" data-close-modal="modal-review">Close</button>`;
    }

    openModal('modal-review');
  }

  async function reviewApp(decision) {
    if (!currentApp) return;
    const alertEl = document.getElementById('modal-alert');
    alertEl.innerHTML = '';
    try {
      await api('PATCH', `/api/applications/${currentApp._id}`, { status: decision });
      closeModal('modal-review');
      showToast(decision === 'accepted' ? 'Application accepted — DM sent!' : 'Application denied.');
      loadApplications();
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error show">${err.message}</div>`;
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('refresh-btn').addEventListener('click', loadApplications);

  // Event delegation for application cards — open modal on click
  document.querySelector('.content').addEventListener('click', (e) => {
    const card = e.target.closest('[data-app-id]');
    if (card) openApp(card.dataset.appId);
  });

  // Event delegation for modal action buttons (accept/deny/close rendered dynamically)
  document.getElementById('modal-actions').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (btn) {
      if (btn.dataset.action === 'accept') reviewApp('accepted');
      if (btn.dataset.action === 'deny')   reviewApp('denied');
    }
  });

  window.reviewApp = reviewApp;

  init();
</script>
</body>
</html>
