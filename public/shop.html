<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Coming Soon — Georgia State Roleplay</title>
  <meta name="theme-color" content="#4f6fff" />
  <link rel="icon" href="https://cdn.discordapp.com/icons/1530375780012658918/a1de3f778cee54317a36cbe02e0169de.webp?size=128" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/home.css" />
  <style>
    body { animation: fadeIn 0.4s ease both; }
    .cs-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 100px 24px 60px;
      position: relative; z-index: 1; overflow: hidden;
    }
    .cs-orb {
      position: absolute; border-radius: 50%; filter: blur(80px);
      pointer-events: none; z-index: 0; animation: glowPulse 6s ease-in-out infinite;
    }
    .cs-orb-1 { width: 700px; height: 500px; background: radial-gradient(ellipse, rgba(79,111,255,0.18) 0%, transparent 70%); top: 10%; left: 50%; transform: translateX(-50%); }
    .cs-orb-2 { width: 350px; height: 350px; background: radial-gradient(ellipse, rgba(124,93,255,0.10) 0%, transparent 70%); bottom: 10%; left: 8%; animation-delay: 2s; }
    .cs-orb-3 { width: 280px; height: 280px; background: radial-gradient(ellipse, rgba(245,158,11,0.07) 0%, transparent 70%); top: 25%; right: 8%; animation-delay: 4s; }

    .cs-inner { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }

    .cs-icon {
      width: 90px; height: 90px; border-radius: 22px; margin: 0 auto 32px;
      background: rgba(79,111,255,0.08); border: 1px solid rgba(79,111,255,0.25);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 50px rgba(79,111,255,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: float 4s ease-in-out infinite;
    }
    .cs-icon svg { color: #4f6fff; }

    .cs-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: #4f6fff; background: rgba(79,111,255,0.10);
      border: 1px solid rgba(79,111,255,0.28); border-radius: 99px;
      padding: 5px 16px; margin-bottom: 28px;
      animation: fadeUp 0.7s 0.1s both;
    }
    .cs-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: #4f6fff; animation: pulseDot 2s infinite; }

    .cs-title {
      font-size: clamp(42px, 8vw, 88px); font-weight: 900;
      line-height: 0.95; letter-spacing: -0.04em; margin-bottom: 22px;
      animation: fadeUp 0.8s 0.15s both;
    }
    .cs-title .t1 { display: block; color: #f0f4ff; }
    .cs-title .t2 {
      display: block;
      background: linear-gradient(135deg, #6b8aff 0%, #4f6fff 40%, #7c5dff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 40px rgba(79,111,255,0.5));
    }

    .cs-sub {
      font-size: 16px; color: #8892a4; line-height: 1.75;
      margin-bottom: 40px; animation: fadeUp 0.8s 0.25s both;
    }

    .cs-robux {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 24px; border-radius: 12px;
      background: rgba(79,111,255,0.08); border: 1px solid rgba(79,111,255,0.22);
      font-size: 14px; font-weight: 600; color: #f0f4ff;
      animation: fadeUp 0.8s 0.35s both;
      box-shadow: 0 0 24px rgba(79,111,255,0.10);
    }
    .cs-robux svg { color: #4f6fff; flex-shrink: 0; }

    .cs-back {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 32px; font-size: 13px; font-weight: 600;
      color: #5a6580; text-decoration: none;
      transition: color 0.2s;
      animation: fadeUp 0.8s 0.45s both;
    }
    .cs-back:hover { color: #4f6fff; }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav class="navbar" id="navbar">
  <a href="/" class="nav-brand">
    <img src="https://cdn.discordapp.com/icons/1530375780012658918/a1de3f778cee54317a36cbe02e0169de.webp?size=128" alt="GSRP" loading="eager" />
    Georgia State
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="/">Home</a></li>
    <li><a href="/map.html">Map</a></li>
    <li><a href="/shop.html" class="active">Shop</a></li>
    <li><a href="/apply.html">Apply</a></li>
  </ul>
  <div class="nav-actions">
    <a href="https://staff.gssrp.xyz/login" class="btn btn-glass" target="_blank" rel="noopener">Staff Panel</a>
    <a href="https://discord.gg/gssrp" class="btn btn-primary" target="_blank" rel="noopener">JOIN SERVER</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="cs-page">
  <div class="cs-orb cs-orb-1"></div>
  <div class="cs-orb cs-orb-2"></div>
  <div class="cs-orb cs-orb-3"></div>

  <div class="cs-inner">
    <div class="cs-icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </div>

    <div class="cs-tag">
      <span class="dot"></span>
      Coming Soon
    </div>

    <h1 class="cs-title">
      <span class="t1">GSRP</span>
      <span class="t2">STORE</span>
    </h1>

    <p class="cs-sub">
      The GSRP store is currently being set up. Purchases will use Robux. Check back soon for exclusive perks, roles, and more.
    </p>

    <div class="cs-robux">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Purchases will be made in Robux
    </div>

    <a href="/" class="cs-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Home
    </a>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize, { passive: true });
  function rand(a, b) { return Math.random() * (b - a) + a; }
  class Particle {
    constructor() { this.reset(); }
    reset() { this.x=rand(0,W); this.y=rand(0,H); this.r=rand(0.6,2.2); this.vx=rand(-0.15,0.15); this.vy=rand(-0.25,-0.05); this.a=rand(0.1,0.5); this.da=rand(-0.001,0.001); }
    update() { this.x+=this.vx; this.y+=this.vy; this.a+=this.da; if(this.a<=0.05||this.a>=0.55) this.da*=-1; if(this.y<-10||this.x<-10||this.x>W+10) this.reset(); }
    draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle=`rgba(79,111,255,${this.a})`; ctx.fill(); }
  }
  for (let i=0; i<90; i++) particles.push(new Particle());
  (function loop() { ctx.clearRect(0,0,W,H); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();
})();

const navbar = document.getElementById('navbar');
window.addEventListener('scroll', () => {
  navbar.style.background = window.scrollY > 40 ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.04)';
  navbar.style.backdropFilter = window.scrollY > 40 ? 'blur(36px) saturate(200%)' : 'blur(28px) saturate(180%)';
}, { passive: true });
const toggle = document.getElementById('navToggle');
const links  = document.getElementById('navLinks');
toggle.addEventListener('click', () => {
  const open = links.classList.toggle('open');
  toggle.setAttribute('aria-expanded', open);
  const [s0,s1,s2] = toggle.querySelectorAll('span');
  if (open) { s0.style.transform='translateY(7px) rotate(45deg)'; s1.style.opacity='0'; s2.style.transform='translateY(-7px) rotate(-45deg)'; }
  else { s0.style.transform=s1.style.opacity=s2.style.transform=''; }
});
</script>
</body>
</html>
