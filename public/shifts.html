<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shifts — Georgia State Roleplay Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Shifts</span>
      <div class="topbar-right">
        <div class="shift-timer" id="shift-timer" style="font-size:18px;margin-right:8px;">00:00:00</div>
        <button class="btn btn-success" id="shift-btn">Go On Duty</button>
      </div>
    </header>
    <div class="content">

      <div class="two-col mb-16">
        <!-- Active shifts -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Currently On Duty</span>
            <span class="badge badge-green" id="duty-count">0</span>
          </div>
          <div id="active-shifts"><div class="empty-state">No one is on duty.</div></div>
        </div>

        <!-- Leaderboard -->
        <div class="card">
          <div class="card-header"><span class="card-title">Top Hours (7 Days)</span></div>
          <div id="top-hours"><div class="empty-state">No data this week.</div></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let shiftActive = false;
  let shiftStart  = null;
  let timerInterval = null;

  async function init() {
    await renderSidebar();
    loadActiveShifts();
    loadTopHours();
    loadShiftStatus();
  }

  async function loadActiveShifts() {
    try {
      const shifts = await api("GET", "/api/staff/shifts/all");
      document.getElementById("duty-count").textContent = shifts.length;
      const el = document.getElementById("active-shifts");
      if (!shifts.length) { el.innerHTML = '<div class="empty-state">No one is on duty.</div>'; return; }
      el.innerHTML = shifts.map(s => `
        <div class="feed-item">
          <div class="feed-dot green"></div>
          <span>${s.username || s.discordId}</span>
          <span class="feed-time">${formatDuration(Date.now() - s.startedAt)}</span>
        </div>
      `).join("");
    } catch {}
  }

  async function loadTopHours() {
    try {
      const top = await api("GET", "/api/staff/shifts/top");
      const el  = document.getElementById("top-hours");
      if (!top.length) { el.innerHTML = '<div class="empty-state">No shift data this week.</div>'; return; }
      el.innerHTML = top.map((u, i) => `
        <div class="feed-item">
          <span style="color:var(--text-muted);min-width:22px;font-size:12px;">#${i+1}</span>
          <span>${u.username || u.discordId}</span>
          <span class="feed-time">${formatDuration(u.total)}</span>
        </div>
      `).join("");
    } catch {}
  }

  async function loadShiftStatus() {
    try {
      const shift = await api("GET", "/api/staff/shift/active");
      if (shift) {
        shiftActive = true;
        shiftStart  = shift.startedAt;
        document.getElementById("shift-btn").textContent = "Go Off Duty";
        document.getElementById("shift-btn").className = "btn btn-danger";
        startTimer();
      }
    } catch {}
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = Date.now() - shiftStart;
      const s = Math.floor(elapsed / 1000);
      const h = Math.floor(s / 3600).toString().padStart(2, "0");
      const m = Math.floor((s % 3600) / 60).toString().padStart(2, "0");
      const sec = (s % 60).toString().padStart(2, "0");
      document.getElementById("shift-timer").textContent = `${h}:${m}:${sec}`;
    }, 1000);
  }

  document.getElementById("shift-btn").addEventListener("click", async () => {
    try {
      if (!shiftActive) {
        const shift = await api("POST", "/api/staff/shift/start");
        shiftActive = true;
        shiftStart  = shift.startedAt;
        document.getElementById("shift-btn").textContent = "Go Off Duty";
        document.getElementById("shift-btn").className = "btn btn-danger";
        startTimer();
        showToast("Shift started!");
        loadActiveShifts();
      } else {
        const result = await api("POST", "/api/staff/shift/end");
        shiftActive = false;
        clearInterval(timerInterval);
        document.getElementById("shift-timer").textContent = "00:00:00";
        document.getElementById("shift-btn").textContent = "Go On Duty";
        document.getElementById("shift-btn").className = "btn btn-success";
        showToast(`Shift ended. Duration: ${formatDuration(result.duration)}`);
        loadActiveShifts();
        loadTopHours();
      }
    } catch (err) {
      showToast(err.message, "error");
    }
  });

  init();
</script>
</body>
</html>
