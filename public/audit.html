<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log — GSSRP Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Audit Log</span>
    </header>
    <div class="content">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Actor</th>
                <th>Action</th>
                <th>Target</th>
                <th>Details</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="5" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const ACTION_COLORS = {
    infraction_add:     "red",
    infraction_remove:  "yellow",
    infractions_clear:  "red",
    promotion_promotion:"green",
    promotion_demotion: "red",
    erlc_command:       "blue",
    password_generated: "purple",
    access_level_changed:"yellow",
  };

  let currentPage = 1;

  async function init() {
    await renderSidebar();
    load(1);
  }

  async function load(page) {
    currentPage = page;
    try {
      const data = await api("GET", `/api/staff/audit?page=${page}&limit=50`);
      renderTable(data.records);
      renderPagination(page, Math.ceil(data.total / 50));
    } catch (err) {
      document.getElementById("table-body").innerHTML = `<tr><td colspan="5" class="empty-state">${err.message}</td></tr>`;
    }
  }

  function renderTable(records) {
    const tbody = document.getElementById("table-body");
    if (!records.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No audit records.</td></tr>'; return; }
    tbody.innerHTML = records.map(r => {
      const color = ACTION_COLORS[r.action] || "gray";
      const details = r.details ? Object.entries(r.details).map(([k,v]) => `${k}: ${v}`).join(", ") : "—";
      return `<tr>
        <td>${r.actorName || r.actorId || "System"}</td>
        <td><span class="badge badge-${color}">${r.action}</span></td>
        <td class="mono text-muted">${r.target || "—"}</td>
        <td class="text-muted" style="font-size:12px;max-width:200px;" title="${details}">${details}</td>
        <td class="text-muted">${formatDate(r.timestamp)}</td>
      </tr>`;
    }).join("");
  }

  function renderPagination(page, pages) {
    const el = document.getElementById("pagination");
    if (pages <= 1) { el.innerHTML = ""; return; }
    let html = "";
    for (let i = 1; i <= pages; i++) {
      html += `<button class="page-btn${i === page ? " active" : ""}" onclick="load(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }

  init();
</script>
</body>
</html>
