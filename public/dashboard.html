<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview — Georgia State Roleplay Staff Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Punishment log card list ── */
    .plog-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background 0.12s;
      border-radius: var(--radius-sm);
      padding-left: 6px; padding-right: 6px;
      margin: 0 -6px;
    }
    .plog-item:last-child { border-bottom: none; }
    .plog-item:hover { background: rgba(79,111,255,0.04); }

    .plog-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-hover); flex-shrink: 0;
      border: 1.5px solid var(--border-md);
      object-fit: cover;
    }
    .plog-body { flex: 1; min-width: 0; }
    .plog-top {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 3px; flex-wrap: wrap;
    }
    .plog-username {
      font-size: 13px; font-weight: 700; color: var(--text-primary);
    }
    .plog-type-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .plog-reason {
      font-size: 12px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .plog-meta {
      font-size: 11px; color: var(--text-muted); margin-top: 2px;
    }

    /* ── Log form inline ── */
    .log-form-grid {
      display: grid; gap: 10px;
    }
    .type-pills {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .type-pill {
      padding: 5px 12px; border-radius: 99px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
      border: 1px solid var(--border-md); background: transparent;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: all 0.15s; text-transform: uppercase;
    }
    .type-pill:hover { border-color: var(--accent); color: var(--accent); }
    .type-pill.selected-verbal  { background: rgba(107,114,128,0.15); border-color: #6b7280; color: #9ca3af; }
    .type-pill.selected-warn    { background: rgba(245,158,11,0.12); border-color: var(--warning); color: var(--warning); }
    .type-pill.selected-kick    { background: rgba(139,92,246,0.12); border-color: var(--purple); color: var(--purple); }
    .type-pill.selected-ban     { background: rgba(239,68,68,0.12); border-color: var(--danger); color: var(--danger); }

    /* ── User profile popup ── */
    .profile-popup-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px;
    }
    .profile-popup-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid var(--border-md); flex-shrink: 0;
      object-fit: cover; background: var(--bg-hover);
    }
    .profile-popup-name { font-size: 18px; font-weight: 800; }
    .profile-popup-id   { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }

    .profile-section-label {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    .profile-plog {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .profile-plog:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Overview</span>
      <div class="topbar-right">
        <!-- User chip -->
        <div id="user-chip" style="display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 12px 5px 8px;cursor:default;">
          <img id="chip-avatar" src="" style="width:22px;height:22px;border-radius:50%;" alt="">
          <div style="display:flex;flex-direction:column;">
            <span id="chip-name" style="font-size:11.5px;font-weight:600;line-height:1.2;"></span>
            <span id="chip-rank" style="font-size:10px;font-weight:500;line-height:1.2;"></span>
          </div>
        </div>
      </div>
    </header>

    <div class="content">
      <!-- Stats row -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div><div class="stat-value" id="stat-onduty">—</div><div class="stat-label">On Duty</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div><div class="stat-value" id="stat-inserver">—</div><div class="stat-label">In Server</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>
          <div><div class="stat-value" id="stat-queue">—</div><div class="stat-label">In Queue</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <div><div class="stat-value" id="stat-loas">—</div><div class="stat-label">Active LOAs</div></div>
        </div>
      </div>

      <!-- Profile + shift -->
      <div class="card mb-16">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:14px;">
            <img id="profile-avatar" src="" style="width:48px;height:48px;border-radius:50%;background:var(--bg-hover);" alt="">
            <div>
              <div style="font-size:16px;font-weight:700;" id="profile-name"></div>
              <div style="font-size:12px;" id="profile-rank"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;">
            <div class="shift-timer" id="shift-timer">00:00:00</div>
            <button class="btn btn-success" id="shift-btn">Go On Duty</button>
          </div>
        </div>
      </div>

      <!-- Two column: shifts + log punishment -->
      <div class="two-col mb-16">
        <!-- Active shifts -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Active Shifts</span>
            <a href="/shifts" class="btn btn-ghost btn-sm">View All</a>
          </div>
          <div id="active-shifts"><div class="empty-state">No one is on duty.</div></div>
        </div>

        <!-- Punishments card — list with Log button that opens modal -->
        <div class="card" id="log-panel" style="display:flex;flex-direction:column;">
          <div class="card-header" style="flex-shrink:0;">
            <span class="card-title">Punishments</span>
            <button class="btn btn-primary btn-sm" id="toggle-log-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Log Punishment
            </button>
          </div>
          <!-- Punishment list — scrollable, stays in card -->
          <div id="recent-punishments" style="overflow-y:auto;max-height:340px;">
            <div class="empty-state">No punishments logged.</div>
          </div>
        </div>
      </div>

      <!-- Bottom: live feed + recent punishments -->
      <div class="two-col">
        <!-- Live feed -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Live Feed</span>
            <span class="badge badge-blue">ERLC</span>
          </div>
          <div id="live-feed"><div class="empty-state">No activity yet.</div></div>
        </div>

        <!-- Top Hours -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Top Hours (7 Days)</span>
            <a href="/statistics" class="btn btn-ghost btn-sm">Full Board</a>
          </div>
          <div id="top-hours"><div class="empty-state">No shift data this week.</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Log Punishment modal -->
<div class="modal-overlay" id="modal-punishment">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Log Punishment</span>
      <button class="modal-close" onclick="closeModal('modal-punishment')">&times;</button>
    </div>
    <div id="log-alert"></div>
    <form id="form-log" class="log-form-grid">
      <div>
        <label class="form-label" style="margin-bottom:5px;">Roblox Username</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <img id="log-avatar" src="" style="width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border-md);background:var(--bg-hover);flex-shrink:0;display:none;" alt="">
          <input class="form-input" id="log-username" placeholder="RobloxUsername" required autocomplete="off" />
        </div>
      </div>
      <div>
        <label class="form-label" style="margin-bottom:5px;">Type</label>
        <div class="type-pills" id="type-pills">
          <button type="button" class="type-pill" data-type="verbal">Verbal Warn</button>
          <button type="button" class="type-pill" data-type="warn">Warn</button>
          <button type="button" class="type-pill" data-type="kick">Kick</button>
          <button type="button" class="type-pill" data-type="ban">Ban</button>
        </div>
        <input type="hidden" id="log-type" />
      </div>
      <div>
        <label class="form-label" style="margin-bottom:5px;">Reason</label>
        <input class="form-input" id="log-reason" placeholder="Reason for punishment" required />
      </div>
      <div>
        <label class="form-label" style="margin-bottom:5px;">Description <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <textarea class="form-textarea" id="log-desc" placeholder="Additional details..." style="min-height:70px;"></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-punishment')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="log-submit">Submit</button>
      </div>
    </form>
  </div>
</div>
<div class="modal-overlay" id="modal-profile">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Player Profile</span>
      <button class="modal-close" onclick="closeModal('modal-profile')">&times;</button>
    </div>
    <div id="profile-popup-content"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let shiftActive = false, shiftStart = null, timerInterval = null;
  let selectedType = '';

  const TYPE_META = {
    verbal: { label: 'Verbal Warn', color: '#9ca3af', bg: 'rgba(107,114,128,0.12)', cls: 'badge-gray'   },
    warn:   { label: 'Warn',        color: '#f59e0b', bg: 'rgba(245,158,11,0.12)',  cls: 'badge-yellow' },
    kick:   { label: 'Kick',        color: '#8b5cf6', bg: 'rgba(139,92,246,0.12)',  cls: 'badge-purple' },
    ban:    { label: 'Ban',         color: '#ef4444', bg: 'rgba(239,68,68,0.12)',   cls: 'badge-red'    },
  };

  // Roblox API proxy — resolves username → userId → headshot
  async function getRobloxAvatar(username) {
    try {
      const idRes = await fetch(`/api/roblox/user?username=${encodeURIComponent(username)}`);
      if (!idRes.ok) return null;
      const { id } = await idRes.json();
      if (!id) return null;
      const thumbRes = await fetch(`/api/roblox/avatar?userId=${id}`);
      if (!thumbRes.ok) return null;
      const { url } = await thumbRes.json();
      return { id, url };
    } catch { return null; }
  }

  async function init() {
    const user = await getUser();
    if (!user) return;
    renderSidebar();

    const colors = { owner:'#f59e0b', management:'#ef4444', admin:'#8b5cf6', moderator:'#4f6fff', staff:'#22c55e' };
    const avatarUrl = user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.discordId}/${user.avatar}.png?size=64`
      : `https://cdn.discordapp.com/embed/avatars/0.png`;

    document.getElementById('chip-avatar').src = avatarUrl;
    document.getElementById('chip-name').textContent = user.displayName;
    const chipRank = document.getElementById('chip-rank');
    chipRank.textContent = user.roleLabel || capitalize(user.accessLevel);
    chipRank.style.color = colors[user.accessLevel] || '#4f6fff';

    document.getElementById('profile-avatar').src = avatarUrl;
    document.getElementById('profile-name').textContent = user.displayName;
    const pRank = document.getElementById('profile-rank');
    pRank.textContent = user.roleLabel || capitalize(user.accessLevel);
    pRank.style.color = user.roleColor || colors[user.accessLevel] || '#4f6fff';

    // Hide log panel if not moderator+
    if (!hasLevel(user.accessLevel, 'moderator')) {
      document.getElementById('log-panel').style.display = 'none';
    }

    loadStats();
    loadActiveShifts();
    loadErlcFeed();
    loadShiftStatus();
    loadRecentPunishments();
    loadTopHours();
    setupTypePills();
    setupAvatarPreview();

    document.getElementById('toggle-log-btn').addEventListener('click', () => openModal('modal-punishment'));
  }

  /* ── Type pills ─────────────────────────────────────────────────────────── */
  function setupTypePills() {
    document.querySelectorAll('.type-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.type-pill').forEach(p => p.className = 'type-pill');
        const t = pill.dataset.type;
        pill.classList.add(`selected-${t}`);
        selectedType = t;
        document.getElementById('log-type').value = t;
      });
    });
  }

  /* ── Live avatar preview as user types ──────────────────────────────────── */
  let avatarDebounce = null;
  function setupAvatarPreview() {
    const input = document.getElementById('log-username');
    const img   = document.getElementById('log-avatar');
    input.addEventListener('input', () => {
      clearTimeout(avatarDebounce);
      const val = input.value.trim();
      if (!val) { img.style.display = 'none'; return; }
      avatarDebounce = setTimeout(async () => {
        const result = await getRobloxAvatar(val);
        if (result) {
          img.src = result.url;
          img.style.display = 'block';
          img.dataset.userId = result.id;
        } else {
          img.style.display = 'none';
          delete img.dataset.userId;
        }
      }, 600);
    });
  }

  /* ── Submit ─────────────────────────────────────────────────────────────── */
  document.getElementById('form-log').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('log-alert');
    alertEl.innerHTML = '';

    if (!selectedType) {
      alertEl.innerHTML = '<div class="alert alert-error show">Please select a punishment type.</div>';
      return;
    }

    const btn = document.getElementById('log-submit');
    btn.disabled = true; btn.textContent = 'Submitting…';

    const username = document.getElementById('log-username').value.trim();
    const avatarImg = document.getElementById('log-avatar');

    try {
      await api('POST', '/api/infractions', {
        userId:      username,
        robloxUserId: avatarImg.dataset.userId || null,
        type:        selectedType,
        reason:      document.getElementById('log-reason').value.trim(),
        description: document.getElementById('log-desc').value.trim(),
        source:      'web',
      });
      showToast('Punishment logged!');
      e.target.reset();
      selectedType = '';
      document.querySelectorAll('.type-pill').forEach(p => p.className = 'type-pill');
      document.getElementById('log-type').value = '';
      avatarImg.style.display = 'none';
      alertEl.innerHTML = '';
      closeModal('modal-punishment');
      loadRecentPunishments();
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error show">${err.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Submit Punishment';
    }
  });

  /* ── Recent punishments list ────────────────────────────────────────────── */
  async function loadRecentPunishments() {
    const el = document.getElementById('recent-punishments');
    try {
      const { records } = await api('GET', '/api/infractions?limit=8');
      if (!records.length) { el.innerHTML = '<div class="empty-state">No punishments logged.</div>'; return; }
      el.innerHTML = records.map(r => {
        const t = (r.type || 'warn').toLowerCase();
        const m = TYPE_META[t] || TYPE_META.warn;
        const avatarSrc = r.robloxAvatarUrl
          ? r.robloxAvatarUrl
          : `https://www.roblox.com/bust-thumbnail/image?userId=${r.robloxUserId || 0}&width=48&height=48&format=Png`;
        return `
          <div class="plog-item" onclick="viewUser('${escHtml(r.userId)}', '${r.robloxUserId || ''}')">
            <img class="plog-avatar" src="${avatarSrc}" alt="" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="plog-body">
              <div class="plog-top">
                <span class="plog-username">${escHtml(r.userId)}</span>
                <span class="plog-type-badge" style="background:${m.bg};color:${m.color};border:1px solid ${m.color}33;">${m.label}</span>
              </div>
              <div class="plog-reason">${escHtml(r.reason)}</div>
              <div class="plog-meta">${timeAgo(r.timestamp)}</div>
            </div>
          </div>`;
      }).join('');
    } catch { el.innerHTML = '<div class="empty-state">Could not load punishments.</div>'; }
  }

  /* ── User profile popup ─────────────────────────────────────────────────── */
  async function viewUser(username, robloxUserId) {
    const content = document.getElementById('profile-popup-content');
    content.innerHTML = '<div class="empty-state">Loading...</div>';
    openModal('modal-profile');

    try {
      const [records, avatarData] = await Promise.all([
        api('GET', `/api/infractions/${encodeURIComponent(username)}`),
        robloxUserId ? fetch(`/api/roblox/avatar?userId=${robloxUserId}`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null),
      ]);

      const avatarUrl = avatarData?.url || `https://www.roblox.com/bust-thumbnail/image?userId=${robloxUserId||0}&width=150&height=150&format=Png`;

      const badgeCounts = {};
      records.forEach(r => { const t = (r.type||'warn').toLowerCase(); badgeCounts[t] = (badgeCounts[t]||0)+1; });

      content.innerHTML = `
        <div class="profile-popup-header">
          <img class="profile-popup-avatar" src="${avatarUrl}" alt="" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
          <div>
            <div class="profile-popup-name">${escHtml(username)}</div>
            ${robloxUserId ? `<div class="profile-popup-id">ID: ${robloxUserId}</div>` : ''}
            <div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;">
              ${Object.entries(badgeCounts).map(([t,c]) => {
                const m = TYPE_META[t] || TYPE_META.warn;
                return `<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:${m.bg};color:${m.color};border:1px solid ${m.color}33;">${c}x ${m.label}</span>`;
              }).join('')}
            </div>
          </div>
        </div>
        <div class="profile-section-label">${records.length} Punishment${records.length !== 1 ? 's' : ''}</div>
        <div>
          ${records.length === 0
            ? '<div class="empty-state" style="padding:16px;">No punishments on record.</div>'
            : records.map(r => {
                const t = (r.type||'warn').toLowerCase();
                const m = TYPE_META[t] || TYPE_META.warn;
                return `
                  <div class="profile-plog">
                    <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0;background:${m.bg};color:${m.color};border:1px solid ${m.color}33;">${m.label}</span>
                    <div style="flex:1;min-width:0;">
                      <div style="font-size:12px;color:var(--text-primary);">${escHtml(r.reason)}</div>
                      ${r.description ? `<div style="font-size:11px;color:var(--text-muted);">${escHtml(r.description)}</div>` : ''}
                    </div>
                    <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;">${timeAgo(r.timestamp)}</span>
                  </div>`;
              }).join('')}
        </div>`;
    } catch (err) {
      content.innerHTML = `<div class="empty-state">${err.message}</div>`;
    }
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadTopHours() {
    try {
      const top = await api('GET', '/api/staff/shifts/top');
      const el  = document.getElementById('top-hours');
      if (!top || !top.length) { el.innerHTML = '<div class="empty-state">No shift data this week.</div>'; return; }
      el.innerHTML = top.map((u, i) => `
        <div class="feed-item">
          <span style="color:var(--text-muted);min-width:18px;">#${i+1}</span>
          <span>${u.username || u.discordId}</span>
          <span class="feed-time">${formatDuration(u.total)}</span>
        </div>`).join('');
    } catch {}
  }

  /* ── Stats ──────────────────────────────────────────────────────────────── */
  async function loadStats() {
    try {
      const [shifts, server] = await Promise.all([
        api('GET', '/api/staff/shifts/all'),
        api('GET', '/api/erlc/server?Players=true&Queue=true').catch(() => null),
      ]);
      document.getElementById('stat-onduty').textContent   = shifts.length;
      document.getElementById('stat-inserver').textContent = server ? server.CurrentPlayers : '—';
      document.getElementById('stat-queue').textContent    = server?.Queue ? server.Queue.length : '—';
      const loas = await api('GET', '/api/staff/loa/all').catch(() => []);
      document.getElementById('stat-loas').textContent = loas.filter(l => l.status === 'approved').length;
    } catch {}
  }

  async function loadActiveShifts() {
    try {
      const shifts = await api('GET', '/api/staff/shifts/all');
      const el = document.getElementById('active-shifts');
      if (!shifts.length) { el.innerHTML = '<div class="empty-state">No one is on duty.</div>'; return; }
      el.innerHTML = shifts.slice(0,8).map(s => `
        <div class="feed-item">
          <div class="feed-dot green"></div>
          <span>${s.username || s.discordId}</span>
          <span class="feed-time">${formatDuration(Date.now() - s.startedAt)}</span>
        </div>`).join('');
    } catch {}
  }

  async function loadErlcFeed() {
    try {
      const logs = await api('GET', '/api/erlc/join-logs');
      const el = document.getElementById('live-feed');
      if (!logs.length) { el.innerHTML = '<div class="empty-state">No ERLC activity.</div>'; return; }
      el.innerHTML = logs.slice(-10).reverse().map(l => `
        <div class="feed-item">
          <div class="feed-dot ${l.Join ? 'green' : 'red'}"></div>
          <span>${l.Player || 'Unknown'} ${l.Join ? 'joined' : 'left'}</span>
          <span class="feed-time">${formatTime(l.Timestamp * 1000)}</span>
        </div>`).join('');
    } catch {
      document.getElementById('live-feed').innerHTML = '<div class="empty-state">ERLC data unavailable.</div>';
    }
  }

  async function loadShiftStatus() {
    try {
      const shift = await api('GET', '/api/staff/shift/active');
      if (shift) {
        shiftActive = true; shiftStart = shift.startedAt;
        document.getElementById('shift-btn').textContent = 'Go Off Duty';
        document.getElementById('shift-btn').className = 'btn btn-danger';
        startTimer();
      }
    } catch {}
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const s = Math.floor((Date.now() - shiftStart) / 1000);
      const h = Math.floor(s/3600).toString().padStart(2,'0');
      const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
      const sc = (s%60).toString().padStart(2,'0');
      document.getElementById('shift-timer').textContent = `${h}:${m}:${sc}`;
    }, 1000);
  }

  document.getElementById('shift-btn').addEventListener('click', async () => {
    try {
      if (!shiftActive) {
        const shift = await api('POST', '/api/staff/shift/start');
        shiftActive = true; shiftStart = shift.startedAt;
        document.getElementById('shift-btn').textContent = 'Go Off Duty';
        document.getElementById('shift-btn').className = 'btn btn-danger';
        startTimer(); showToast('Shift started!'); loadActiveShifts();
      } else {
        const result = await api('POST', '/api/staff/shift/end');
        shiftActive = false; clearInterval(timerInterval);
        document.getElementById('shift-timer').textContent = '00:00:00';
        document.getElementById('shift-btn').textContent = 'Go On Duty';
        document.getElementById('shift-btn').className = 'btn btn-success';
        showToast(`Shift ended. Duration: ${formatDuration(result.duration)}`);
        loadActiveShifts();
      }
    } catch (err) { showToast(err.message, 'error'); }
  });

  init();
</script>
</body>
</html>
